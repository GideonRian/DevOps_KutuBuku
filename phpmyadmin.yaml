apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin-deployment
spec:
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin
        ports:
        - containerPort: 80
        env:
        - name: PMA_HOST
          value: mysql-service # Menghubungkan ke Service MySQL di file pertama
        - name: PMA_PORT
          value: "3306"

---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin-service
spec:
  type: LoadBalancer # Agar bisa diakses di localhost
  ports:
  - port: 8081      # Port yang kita buka di browser
    targetPort: 80  # Port asli kontainer
  selector:
    app: phpmyadmin